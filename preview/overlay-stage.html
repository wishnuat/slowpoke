<!doctype html>
<!-- A fake desktop corner with the real overlay UI (mocked backend) on top, for screenshots and the clip. -->
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; width: 720px; height: 300px; overflow: hidden; font-family: "Segoe UI", system-ui; }
  body.dark { background: radial-gradient(700px 400px at 20% 20%, #2b4a7f, #131825 60%), #0e1119; }
  body.light { background: radial-gradient(600px 380px at 30% 30%, #ffffff, #dbeafe 45%, #93c5fd 100%); }
  /* a window under the overlay, to show it floats on top of apps */
  .win { position: absolute; left: 36px; top: 40px; width: 430px; height: 250px; border-radius: 10px; background: rgba(255,255,255,.92);
    box-shadow: 0 18px 50px rgba(0,0,0,.28); overflow: hidden; }
  body.dark .win { background: #1e222b; }
  .bar { height: 30px; background: rgba(0,0,0,.05); display: flex; align-items: center; padding: 0 12px; font-size: 12px; color: #555; }
  body.dark .bar { color: #aaa; background: rgba(255,255,255,.04); }
  .line { height: 10px; margin: 14px 16px 0; border-radius: 5px; background: rgba(0,0,0,.08); }
  body.dark .line { background: rgba(255,255,255,.07); }
  iframe { position: absolute; right: 24px; top: 24px; width: 272px; height: 132px; border: 0; border-radius: 12px; background: transparent;
    /* stands in for the Acrylic blur the real window gets from Windows */
    backdrop-filter: blur(18px) saturate(1.4); box-shadow: 0 12px 34px rgba(0,0,0,.35); }
</style>
</head>
<body class="dark">
  <div class="win"><div class="bar">Spreadsheet.xlsx</div><div class="line"></div><div class="line" style="width:60%"></div><div class="line" style="width:80%"></div><div class="line" style="width:45%"></div></div>
  <iframe id="ov" src="/?speed=1#overlay"></iframe>
  <script>
    const p = new URLSearchParams(location.search);
    document.body.className = p.get("theme") || "dark";
    document.getElementById("ov").src = "/?speed=" + (p.get("speed") || "1") + "#overlay";
  </script>
</body>
</html>
